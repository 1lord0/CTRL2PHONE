name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

jobs:
  lint-desktop:
    name: Lint Desktop (Electron)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting (source)
        run: npm run format:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check diff cleanliness
        run: git diff --check

  build-desktop:
    name: Test and Build Desktop (Windows)
    runs-on: windows-latest
    needs: lint-desktop
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting (source)
        run: npm run format:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Compile native helpers
        run: npm run build:native

      - name: Run Jest serially (including native binary tests)
        run: npm test -- --runInBand

      - name: Build TypeScript
        run: npm run build

      - name: Package Electron app
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check diff cleanliness
        run: |
          git diff --check
          git diff --exit-code -- src
