<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ctrl2Phone</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #121826 !important;
      }
      .pill-shell {
        opacity: 1 !important;
        filter: none !important;
        backdrop-filter: none !important;
      }
    </style>
    <link rel="stylesheet" href="./src/pill.css" />
  </head>
  <body class="pill-root">
    <div id="pillShell" class="pill-shell">
      <div id="pillHud" class="pill-hud">
        <button type="button" id="pillOpen" class="pill-open" title="Aç (Ctrl+Shift+Space)" aria-label="Paneli aç">&#8981;</button>
        <strong id="pillStatus" class="pill-status">Hazır</strong>
      </div>
    </div>
    <script src="./src/pill-renderer.js"></script>
  </body>
</html>
