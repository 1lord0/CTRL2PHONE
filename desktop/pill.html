<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ctrl2Phone</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
      .pill-shell {
        opacity: 1 !important;
        filter: none !important;
        backdrop-filter: none !important;
      }
    </style>
    <link rel="stylesheet" href="./src/pill.css" />
  </head>
  <body class="pill-root">
    <div id="pillShell" class="pill-shell">
      <div id="pillHud" class="pill-hud">
        <button type="button" id="pillOpen" class="pill-open" title="Aç (Ctrl+Shift+Space)" aria-label="Paneli aç">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <strong id="pillStatus" class="pill-status">Hazır</strong>
        <div id="pillDownloads" class="pill-downloads"></div>
      </div>
    </div>
    <script src="./dist/js/pill-renderer.js"></script>
  </body>
</html>
